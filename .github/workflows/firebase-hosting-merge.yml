# Auto-deploy to the live Firebase Hosting channel + push Firestore rules
# whenever main moves forward. Pair with branch protection that blocks merges
# until the Test workflow is green, so this never deploys a red build.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT_SUDOKU_926B8
#       JSON key for a service account with roles:
#         - Firebase Hosting Admin
#         - Cloud Datastore Owner   (or "Firebase Rules Admin")
#       Create via: GCP Console → IAM → Service Accounts → Create →
#       grant the roles above → Manage keys → Add key → JSON → paste here.
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN,
#   VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_APP_ID
#       The same values as .env.local — Vite bakes them in at build time.

name: Deploy to Firebase Hosting (live)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Sanity check — project ID baked into bundle
        run: |
          if ! grep -q "sudoku-926b8" dist/assets/*.js; then
            echo "::error::Build is missing Firebase project id — check VITE_FIREBASE_* secrets"
            exit 1
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUDOKU_926B8 }}
          projectId: sudoku-926b8
          channelId: live

      - name: Write service account for Firestore rules deploy
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUDOKU_926B8 }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules
        run: npx firebase deploy --only firestore:rules --project sudoku-926b8 --non-interactive
